[package]
name = "veridex"
version = "0.1.0"
description = "VERIDEX Phase 1: Polymarket-mirrored prediction markets on Solana (stub pricing)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veridex"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
